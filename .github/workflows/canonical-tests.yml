name: canonical-tests

on:
  pull_request:
  push:
    branches:
      - main
      - agent/canonical-research-spine

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make reproduce
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-legacy-results
          path: generated/legacy-v11-results.json
