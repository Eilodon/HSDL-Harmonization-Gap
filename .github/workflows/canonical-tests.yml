name: canonical-tests

on:
  pull_request:
  push:
    branches:
      - main
      - agent/canonical-research-spine
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make reproduce
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-research-results
          path: generated/*.json

  source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify official PDFs against pinned lock
        id: verify
        continue-on-error: true
        run: |
          mkdir -p generated
          PYTHONPATH=src python -m hsdl_gap \
            --mode verify-sources \
            --targets sources/official_pdf_targets.json \
            --lock sources/official_pdf_lock_2026-08-02.json \
            > generated/source-provenance-verification.json
      - name: Show verification report
        if: always()
        run: cat generated/source-provenance-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-provenance-verification
          path: generated/source-provenance-verification.json
          retention-days: 14
      - name: Report pull-request source freshness warning
        if: github.event_name == 'pull_request' && steps.verify.outcome != 'success'
        run: |
          echo "::warning::Live official-source verification failed. The report artifact preserves the transport evidence; offline reproduction and semantic tests remain authoritative for this pull request."
      - name: Enforce pinned checksums outside pull requests
        if: github.event_name != 'pull_request' && steps.verify.outcome != 'success'
        run: exit 1

  source-visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
      - name: Build checksum-verified visual review bundle
        id: visual
        continue-on-error: true
        run: |
          mkdir -p generated
          PYTHONPATH=src python -m hsdl_gap \
            --mode build-review-bundle \
            --lock sources/official_pdf_lock_2026-08-02.json \
            --output-dir generated/source-review-bundle \
            > generated/source-review-index.json
      - name: Show review-bundle index
        if: steps.visual.outcome == 'success'
        run: cat generated/source-review-index.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-visual-review-bundle
          path: |
            generated/source-review-index.json
            generated/source-review-bundle/
          retention-days: 14
          if-no-files-found: ignore
      - name: Report pull-request visual-source warning
        if: github.event_name == 'pull_request' && steps.visual.outcome != 'success'
        run: |
          echo "::warning::Live visual-source bundle generation failed. This is a network freshness signal and does not invalidate the checksum-pinned historical model or offline test suite."
      - name: Enforce visual-source bundle outside pull requests
        if: github.event_name != 'pull_request' && steps.visual.outcome != 'success'
        run: exit 1
